<style>

  .row{display:flex;gap:10px}
  .row > div{flex:1}
  button{width:100%;margin-top:22px;padding:13px;background:var(--ink);color:var(--paper);border:none;border-radius:4px;font:inherit;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s}
  button:active{transform:scale(.98)}
  button:disabled{opacity:.6;cursor:wait}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .linkbox{margin-top:18px;display:none;border:1px dashed var(--gold);border-radius:4px;padding:14px;background:#fffdf8}
  .linkbox.show{display:block}
  .linkbox .url{font-size:.82rem;direction:ltr;text-align:left;word-break:break-all;color:#555;margin-bottom:10px;cursor:pointer}
  .copybtn{margin-top:0;background:var(--ok)}
  .wabtn{margin-top:8px;background:#128c4b}
  .newbtn{margin-top:8px;background:transparent;color:var(--ink);border:1px solid var(--line)}
  .hint{font-size:.72rem;color:#7a7060;margin-top:10px;line-height:1.7}
  .cust{text-align:center}
  .amount{font-family:'Amiri',serif;font-size:3rem;font-weight:700;margin:14px 0 2px;letter-spacing:1px;display:flex;align-items:baseline;justify-content:center;gap:8px}
  .amount .cur{font-size:1.1rem;font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:500;color:var(--gold)}
  .writing{border-left:3px solid var(--accent);padding-left:2px;animation:penblink .5s step-end infinite}
  @keyframes penblink{50%{border-color:transparent}}
  .stamp{color:var(--accent);margin:16px auto 0;width:96px;height:96px;opacity:0;transform:scale(2.4) rotate(-18deg);transition:none}
  .stamp.stamped{animation:stampdrop .5s cubic-bezier(.2,1.4,.4,1) forwards}
  @keyframes stampdrop{
    0%{opacity:0;transform:scale(2.4) rotate(-18deg)}
    60%{opacity:.9;transform:scale(.92) rotate(-13deg)}
    80%{transform:scale(1.04) rotate(-15deg)}
    100%{opacity:.82;transform:scale(1) rotate(-14deg)}
  }
  @media (prefers-reduced-motion:reduce){
    .writing{animation:none;border-left:none}
    .stamp.stamped{animation:none;opacity:.82;transform:scale(1) rotate(-14deg)}

  .note-cust{font-size:.92rem;line-height:1.9;color:var(--ink);background:#fffdf8;border:1px dashed var(--gold);border-radius:4px;padding:12px 14px;text-align:center}
  .tbar{margin-top:22px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
  .tbar-fill{height:100%;width:100%;border-radius:2px;background:linear-gradient(90deg, var(--gold), var(--accent));transition:width 1s linear}

  .expired{text-align:center;padding:10px 0 4px}
  .expired .x{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.8rem}

  .loading{text-align:center;padding:30px 0;color:#7a7060;font-size:.9rem}
  .fade-out{animation:burn .8s forwards}

function genToken(){
  try {
    const arr = new Uint8Array(20);
    (window.crypto || window.msCrypto).getRandomValues(arr);
    return Array.from(arr, b => b.toString(16).padStart(2,'0')).join('');
  } catch(e){ return 'f' + Date.now().toString(16) + Math.random().toString(16).slice(2); }
}
function hasDeviceToken(id){ try { return !!localStorage.getItem('dev:' + id); } catch(e){ return false; } }
function getDeviceToken(id){
  const key = 'dev:' + id;
  try {
    let t = localStorage.getItem(key);
    if (!t){ t = genToken(); localStorage.setItem(key, t); }
    return t;
  } catch(e){
    if (!window.__memTok) window.__memTok = {};
    if (!window.__memTok[id]) window.__memTok[id] = genToken();
    return window.__memTok[id];
  }
}

async function openCustomer(id){
  try { if (sessionStorage.getItem('x:' + id) === '1'){ renderGone(); return; } } catch(e){}
  if (hasDeviceToken(id)) { revealAmount(id, true); }
  else { renderRevealGate(id); }
}
function renderRevealGate(id){
  setHead('نظام الأقساط', '');
  app.innerHTML = `
    <div class="cust" style="padding:10px 0">
      <div style="font-size:2.4rem;margin-bottom:6px">🔒</div>
      <p style="font-size:.92rem;color:#5a5040;line-height:1.9;margin-bottom:18px">هذا الكشف مخصّص لك وحدك.<br>اضغط الزر لعرض المبلغ.</p>
      <button id="revealBtn" onclick="revealAmount('${id}')" style="width:100%">اضغط لعرض المبلغ</button>
    </div>`;
}
let revealing = false;
async function revealAmount(id, silent){
  if (revealing) return;
  revealing = true;
  const btn = document.getElementById('revealBtn');
  if (silent){ app.innerHTML = '<div class="loading">جارٍ التحميل...</div>'; }
  else if (btn){ btn.disabled = true; btn.textContent = 'جارٍ التحميل...'; btn.style.pointerEvents = 'none'; }
  const token = getDeviceToken(id);
  try {
    const res = await fetch('/.netlify/functions/view?id=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(token), {cache:'no-store'});
    if (res.status === 403){ revealing = false; renderDeviceMismatch(); return; }
    if (res.status === 410){ markGone(id); renderGone(); return; }
    if (!res.ok){ renderGone(); return; }
    const d = await res.json();
    const end = Date.now() + d.left;
    renderCustomerView(d.a, end, d.m, d.left);
  } catch(e){
    revealing = false;
    if (btn){ btn.disabled = false; btn.textContent = 'اضغط لعرض المبلغ'; btn.style.pointerEvents = ''; }
    app.insertAdjacentHTML('beforeend', '<p style="color:var(--accent);font-size:.8rem;text-align:center;margin-top:10px">لا يوجد اتصال بالإنترنت. حاول مجددًا.</p>');
  }
}
function markGone(id){ try { sessionStorage.setItem('x:' + id, '1'); localStorage.removeItem('dev:' + id); } catch(e){} }
function renderDeviceMismatch(){
  setHead('نظام الأقساط', '');
  app.innerHTML = `
    <div class="expired">
      <div class="x">📵</div>
      <h2>هذا الرابط مخصّص لجهاز آخر</h2>
      <p>لأمانك، يعمل هذا الرابط على الجهاز الذي فتحه أول مرة فقط.<br>إن كان هذا جهازك الصحيح فعلًا، تواصل مع المحل لطلب رابط جديد.</p>
    </div>`;
}
function renderCustomerView(amount, end, note, totalMs){
  if (Date.now() >= end){ renderGone(); return; }
  if (!totalMs) totalMs = end - Date.now();
  setHead('نظام الأقساط', '');
  const amtStr = Number(amount).toLocaleString('ar');
  app.innerHTML = `
    <div class="cust" id="custView">
      <div class="amount"><span id="amtWrite" class="writing"></span><span class="cur">دينار أردني</span></div>
      ${note ? `<div class="divider"></div><div class="note-cust">${escapeHtml(note)}</div>` : ''}
      <div class="stamp" id="stamp">
        <svg viewBox="0 0 120 120" width="96" height="96">
          <circle cx="60" cy="60" r="54" fill="none" stroke="currentColor" stroke-width="3"/>
          <circle cx="60" cy="60" r="46" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <text x="60" y="52" text-anchor="middle" font-family="Amiri, serif" font-size="15" font-weight="700" fill="currentColor">نظام</text>
          <text x="60" y="74" text-anchor="middle" font-family="Amiri, serif" font-size="15" font-weight="700" fill="currentColor">الأقساط</text>
          <path d="M28 88 Q60 100 92 88" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="tbar"><div class="tbar-fill" id="tbarFill"></div></div>
    </div>`;

  // تأثير خط اليد: كتابة المبلغ رقمًا رقمًا مع قلم
  const amtEl = document.getElementById('amtWrite');
  const chars = [...amtStr];
  let i = 0;
  function writeNext(){
    if (i < chars.length){
      amtEl.textContent += chars[i];
      i++;
      setTimeout(writeNext, 140);
    } else {
      amtEl.classList.remove('writing');
      // بعد انتهاء الكتابة، يهبط الختم
      const stamp = document.getElementById('stamp');
      if (stamp) setTimeout(()=> stamp.classList.add('stamped'), 250);
    }
  }
  setTimeout(writeNext, 300);

  const fill = document.getElementById('tbarFill');
  function tick(){
    const left = end - Date.now();
    if (left <= 0){ const v = document.getElementById('custView'); if (v) v.classList.add('fade-out'); setTimeout(renderGone, 400); return; }
    if (fill) fill.style.width = Math.max(0, (left / totalMs) * 100) + '%';
    setTimeout(tick, 1000);
  }
  tick();
}
function renderGone(){
  const curId = location.hash.slice(1);
  if (curId) markGone(curId);
  setHead('نظام الأقساط', '');
  const r = REMINDERS[Math.floor(Math.random() * REMINDERS.length)];
  app.innerHTML = `
    <div class="expired">
      <div class="x">✕</div>
      <h2>هذا الرابط لم يعد متاحًا</h2>
      <p>يرجى طلب رابط جديد من المحل.</p>
      <div class="reminder"><div class="rtext">${r.t}</div><div class="rsrc">${r.s}</div></div>
    </div>`;
}
function renderLock(){
  setHead(undefined, 'صفحة خاصة بالمحل');
  app.innerHTML = `
    <label>أدخل الرمز السري</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" style="text-align:center;letter-spacing:8px;font-size:1.4rem" maxlength="30">
    <div id="pinErr" style="color:var(--accent);font-size:.8rem;margin-top:8px;display:none"></div>
    <button id="pinBtn" onclick="checkPin()">دخول</button>`;
  const pin = document.getElementById('pin');
  pin.focus();
  pin.addEventListener('keydown', e => { if(e.key === 'Enter') checkPin(); });
}
async function checkPin(){
  const err = document.getElementById('pinErr');
  const btn = document.getElementById('pinBtn');
  const pinEl = document.getElementById('pin');
  const val = pinEl.value;
  if (!val) return;
  btn.disabled = true; btn.textContent = 'جارٍ التحقق...';
  try {
    const res = await fetch('/.netlify/functions/create', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({pin: val, check: true}) });
    btn.disabled = false; btn.textContent = 'دخول';
    if (res.ok){ sessionPin = val; renderMerchant(); }
    else if (res.status === 429){ err.textContent = 'محاولات كثيرة. حاول بعد 5 دقائق'; err.style.display = 'block'; shakePin(pinEl); }
    else { err.textContent = 'الرمز غير صحيح'; err.style.display = 'block'; pinEl.value = ''; shakePin(pinEl); pinEl.focus(); }
  } catch(e){ btn.disabled = false; btn.textContent = 'دخول'; err.textContent = 'تعذر الاتصال بالخادم'; err.style.display = 'block'; }
}
function shakePin(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function renderMerchant(){
  setHead(undefined, 'نظام الأقساط');
  app.innerHTML = `
    <label>المبلغ المتبقي (دينار أردني)</label>
    <input id="camount" type="number" inputmode="decimal" placeholder="0" min="0.01" max="1000000" step="0.01">
    <label>ملاحظة للزبون (اختياري)</label>
    <input id="cnote" placeholder="مثال: القسط القادم يوم 15 من الشهر" maxlength="120">
    <label>مدة العرض</label>
    <select id="cmin"><option value="5">5 دقائق</option><option value="10">10 دقائق</option><option value="30" selected>30 دقيقة</option><option value="60">ساعة واحدة</option></select>
    <button id="mkBtn" onclick="makeLink()">إنشاء الرابط</button>
    <div class="linkbox" id="lb">
      <div class="url" id="url" onclick="selectUrl(this)" title="اضغط لتحديد الرابط"></div>
      <div id="confirmSettings" style="font-size:.78rem;color:var(--ok);font-weight:500;margin-bottom:10px;text-align:center"></div>
      <button class="copybtn" onclick="copyLink()">نسخ الرابط لإرساله للزبون</button>
      <button class="wabtn" onclick="shareWhatsApp()">إرسال مباشرة عبر واتساب</button>
      <button class="newbtn" onclick="resetForm()">إنشاء رابط جديد</button>
      <div class="hint">🔒 الرابط يعمل بلا حدود على جهاز الزبون الذي يفتحه أولًا فقط، طوال مدة العرض. لن يعمل إن أُرسل لجهاز آخر. يُحذف المبلغ نهائيًا من قاعدة البيانات عند انتهاء المدة.</div>
    </div>`;
}
function resetForm(){
  document.getElementById('camount').value = '';
  document.getElementById('cnote').value = '';
  generated = '';
  document.getElementById('lb').classList.remove('show');
  document.getElementById('camount').focus();
}
let generated = '';
async function makeLink(){
  const raw = document.getElementById('camount').value.trim();
  const amount = Number(raw);
  if (!raw || !isFinite(amount)){ alert('أدخل مبلغًا صحيحًا'); return; }
  if (amount <= 0){ alert('المبلغ يجب أن يكون أكبر من صفر'); return; }
  if (amount > 1000000){ alert('المبلغ يتجاوز الحد المسموح'); return; }
  const btn = document.getElementById('mkBtn');
  btn.disabled = true; btn.textContent = 'جارٍ الإنشاء...';
  try {
    const res = await fetch('/.netlify/functions/create', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ pin: sessionPin, amount: amount, note: document.getElementById('cnote').value.trim(), minutes: parseInt(document.getElementById('cmin').value) }) });
    btn.disabled = false; btn.textContent = 'إنشاء الرابط';
    if (!res.ok){ if (res.status === 401){ alert('انتهت الجلسة، أعد الدخول'); location.reload(); return; } alert('تعذر إنشاء الرابط، حاول مجددًا'); return; }
    const out = await res.json();
    generated = location.origin + '/#' + out.id;
    document.getElementById('url').textContent = generated;
    const minTxt = out.minutes + ' دقيقة';
    document.getElementById('confirmSettings').textContent = 'تم الإنشاء بنجاح — المدة: ' + minTxt + ' | يعمل على جهاز الزبون فقط';
    document.getElementById('lb').classList.add('show');
  } catch(e){ btn.disabled = false; btn.textContent = 'إنشاء الرابط'; alert('تعذر الاتصال بالخادم'); }
}
function copyLink(){
  const done = () => { const b = document.querySelector('.copybtn'); b.textContent = '✓ تم النسخ'; setTimeout(()=> b.textContent = 'نسخ الرابط لإرساله للزبون', 2000); };
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = generated; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.focus(); ta.select(); try { document.execCommand('copy'); done(); } catch(e){ alert('انسخ الرابط يدويًا من المربع أعلاه'); } document.body.removeChild(ta); };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(generated).then(done).catch(fallback); } else { fallback(); }
}
function shareWhatsApp(){ window.open('https://wa.me/?text=' + encodeURIComponent('كشف المبلغ المتبقي:\n' + generated), '_blank'); }
function selectUrl(el){ const range = document.createRange(); range.selectNodeContents(el); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
